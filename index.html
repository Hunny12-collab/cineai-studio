<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineAI Studio V3</title>
<style>
body{margin:0;background:#09090d;color:#fff;font-family:Arial,sans-serif}header{padding:18px;border-bottom:1px solid #292933;font-size:22px;font-weight:800}main{max-width:850px;margin:auto;padding:20px}.card{background:#14141b;border:1px solid #292933;border-radius:18px;padding:18px}label{display:block;color:#aaa;margin:14px 0 7px;font-size:13px}textarea,select{width:100%;box-sizing:border-box;background:#0d0d12;color:#fff;border:1px solid #34343f;border-radius:10px;padding:12px}textarea{min-height:120px}.upload{border:1px dashed #666;border-radius:12px;padding:25px;text-align:center;cursor:pointer}.img{display:none;width:100%;max-height:300px;object-fit:contain;margin-top:12px;border-radius:10px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button,.download{display:block;width:100%;box-sizing:border-box;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#fff;color:#000;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}.status{margin-top:12px;padding:11px;background:#0e0e14;border-radius:10px;color:#aaa}.video{margin-top:18px;background:#050507;border-radius:12px;overflow:hidden}.video video{width:100%;display:block}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>🎬 CineAI Studio</header>
<main><div class="card">
<label>Reference Image</label>
<div class="upload" id="pick">📷 Tap to choose image<br><small>JPG / PNG / WEBP</small></div>
<input id="file" type="file" accept="image/*" hidden>
<img id="img" class="img">
<label>Video Prompt</label>
<textarea id="prompt" placeholder="Ultra-realistic cinematic shot, natural movement, realistic lighting..."></textarea>
<div class="row">
<div><label>Duration</label><select id="duration"><option value="5">5 sec</option><option value="10">10 sec</option></select></div>
<div><label>Ratio</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div>
<div><label>Resolution</label><select id="resolution"><option>720p</option><option>1080p</option></select></div>
</div>
<button id="go">✨ Generate AI Video</button>
<div id="status" class="status">Ready.</div>
<div id="video" class="video"></div>
<a id="download" class="download" style="display:none" download="cineai-video.mp4">⬇️ Download Video</a>
</div></main>
<script>
const file=document.getElementById('file'),pick=document.getElementById('pick'),img=document.getElementById('img'),go=document.getElementById('go'),status=document.getElementById('status'),video=document.getElementById('video'),download=document.getElementById('download');
pick.onclick=()=>file.click();
file.onchange=()=>{if(file.files[0]){img.src=URL.createObjectURL(file.files[0]);img.style.display='block';status.textContent='✅ Image selected: '+file.files[0].name}};
go.onclick=async()=>{
 if(!file.files[0])return status.textContent='⚠️ Reference image select karo.';
 const p=document.getElementById('prompt').value.trim();if(!p)return status.textContent='⚠️ Prompt likho.';
 go.disabled=true;go.textContent='⏳ Generating...';status.textContent='Sending request...';video.innerHTML='';download.style.display='none';
 const fd=new FormData();fd.append('image',file.files[0]);fd.append('prompt',p);fd.append('duration',document.getElementById('duration').value);fd.append('aspect_ratio',document.getElementById('ratio').value);fd.append('resolution',document.getElementById('resolution').value);
 try{const r=await fetch('/api/generate',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Generation failed');if(!d.videoUrl)throw Error('No video URL returned');const v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=d.videoUrl;video.appendChild(v);download.href=d.videoUrl;download.style.display='block';status.textContent='✅ Video ready!'}catch(e){status.textContent='❌ '+e.message}finally{go.disabled=false;go.textContent='✨ Generate AI Video'}
};
</script>
</body></html>
