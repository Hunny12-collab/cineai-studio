<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineAI Studio V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;border-bottom:1px solid #272731;display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:800}
main{max-width:900px;margin:auto;padding:22px}.card{background:#13131a;border:1px solid #292934;border-radius:18px;padding:18px}
label{display:block;color:#bbb;font-size:13px;margin:15px 0 7px}textarea,select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #34343f;background:#0d0d12;color:#fff}
textarea{min-height:125px}.upload{padding:24px;text-align:center;border:1px dashed #555;border-radius:14px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;margin-top:18px;cursor:pointer}.go{background:#fff;color:#08080b}
.status{margin-top:12px;padding:11px;border-radius:10px;background:#0e0e14;color:#aaa}.preview{margin-top:18px;background:#050507;border-radius:14px;overflow:hidden;min-height:250px;display:flex;align-items:center;justify-content:center}.preview video{width:100%;max-height:600px}
@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="logo">🎬 CineAI Studio</div><div>V2 • Live API</div></header>
<main><div class="card">
<label>Reference Image</label>
<div class="upload" onclick="file.click()">📷 Tap to upload character image<br><small>JPG / PNG / WEBP</small></div>
<input id="file" type="file" accept="image/*" hidden>
<div id="name" class="status" style="display:none"></div>

<label>Video Prompt</label>
<textarea id="prompt" placeholder="Ultra-realistic cinematic shot..."></textarea>

<div class="row">
<div><label>Duration</label><select id="duration"><option value="5">5 sec</option><option value="10">10 sec</option></select></div>
<div><label>Aspect Ratio</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div>
<div><label>Resolution</label><select id="resolution"><option>720p</option><option>1080p</option></select></div>
</div>

<button class="go" id="btn" onclick="generate()">✨ Generate AI Video</button>
<div id="status" class="status">API ready: server me FAL_KEY set karne ke baad real generation chalegi.</div>
<div class="preview" id="preview">🎥 Generated video yahan dikhega</div>
</div></main>
<script>
file.onchange=()=>{if(file.files[0]){name.style.display='block';name.textContent='Selected: '+file.files[0].name}}
async function generate(){
 if(!file.files[0]){status.textContent='⚠️ Reference image upload karo.';return}
 if(!prompt.value.trim()){status.textContent='⚠️ Video prompt likho.';return}
 btn.disabled=true;btn.textContent='⏳ Generating...';status.textContent='AI video generation chal rahi hai...';
 const fd=new FormData();fd.append('image',file.files[0]);fd.append('prompt',prompt.value);fd.append('duration',duration.value);fd.append('aspect_ratio',ratio.value);fd.append('resolution',resolution.value);
 try{
  const r=await fetch('/api/generate',{method:'POST',body:fd}); const d=await r.json();
  if(!r.ok) throw new Error(d.error||'Generation failed');
  preview.innerHTML='<video controls playsinline src="'+d.videoUrl+'"></video>';
  status.textContent='✅ Video ready!';
 }catch(e){status.textContent='❌ '+e.message}
 finally{btn.disabled=false;btn.textContent='✨ Generate AI Video'}
}
</script></body></html>
